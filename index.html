    <!-- The hero screenshot is the LCP element, but it lives in JS-rendered markup,
         so the browser only discovers it after the bundle parses. Preloading the same
         srcset here starts the fetch during head parsing instead. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/assets/portrait-800.avif"
      imagesrcset="/assets/portrait-400.avif 400w, /assets/portrait-800.avif 800w"
      imagesizes="(min-width: 1050px) 34vw, 76vw"
      fetchpriority="high"
    />

    <!-- Fonts are self-hosted. They used to come from fonts.googleapis.com, which put
         a third-party host on the critical path: when that request hangs rather than
         failing fast, first paint waits on it.

         Only two of the three faces are preloaded, and the choice is about what is
         above the fold and what would move if it swapped late: the headline (display)
         and the status line (mono). Source Sans 3 is close enough in metrics to the
         system humanist fallback that its swap does not shift layout, so it is left
         to font-display and stays off the critical path. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Fraunces-var-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/PlexMono-400-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Runs before first paint. The theme was only applied in a React effect, so the
         attribute stayed unset until the bundle parsed: a visitor who chose dark last
         time got a pale flash first, and a visitor whose OS is dark got a light site
         permanently, because prefers-color-scheme was never consulted at all.

         This is also why styles.css does not carry a `prefers-color-scheme` media
         query alongside [data-theme='light']: this script has already resolved the
         system preference into an explicit attribute by the time anything paints, and
         with JS off there is no page to theme — #root is empty. Duplicating fifteen
         tokens to cover a case that renders nothing is not worth the drift. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
