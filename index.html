    <!-- Icons: an inline SVG mark scales cleanly, with an ICO fallback for older tabs. -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph: a link to this site should render as a card, not a grey rectangle. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hadi Qusyairi" />
    <meta property="og:url" content="https://portfolio-things-eight.vercel.app/" />
    <meta property="og:title" content="Hadi Qusyairi — the delay is never the task, it’s the handover" />
    <meta
      property="og:description"
      content="Digital Business and FinTech student in Singapore. EMS workforce command center, a NETS loyalty engine, and analytics built around real operational decisions."
    />
    <meta property="og:image" content="https://portfolio-things-eight.vercel.app/og-card.png" />
    <meta property="og:image:width" content="1200" />

    <meta property="og:image:alt" content="Hadi Qusyairi — FinTech and data builder, Singapore." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hadi Qusyairi — the delay is never the task, it’s the handover" />
    <meta
      name="twitter:description"
      content="Digital Business and FinTech student in Singapore. EMS workforce command center, a NETS loyalty engine, and analytics built around real operational decisions."
    />
    <meta name="twitter:image" content="https://portfolio-things-eight.vercel.app/og-card.png" />

    <!-- The hero screenshot is the LCP element, but it lives in JS-rendered markup,
         so the browser only discovers it after the bundle parses. Preloading the same
         srcset here starts the fetch during head parsing instead. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/assets/pulseops-roster-1200.avif"
      imagesrcset="/assets/pulseops-roster-400.avif 400w, /assets/pulseops-roster-800.avif 800w, /assets/pulseops-roster-1200.avif 1200w, /assets/pulseops-roster-1600.avif 1600w"
      imagesizes="(min-width: 1050px) 45vw, 92vw"
      fetchpriority="high"
    />

    <!-- Fonts are self-hosted. They used to come from fonts.googleapis.com, which put
         a third-party host on the critical path: when that request hangs rather than
         failing fast, first paint waits on it. Preloading the two latin files means
         the text that is actually on screen has its face by the time it paints. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/DMSans-latin.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/InstrumentSerif-400-italic-latin.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hadi Qusyairi",
        "url": "https://portfolio-things-eight.vercel.app/",
        "email": "mailto:hadiqbz@gmail.com",
        "jobTitle": "Digital Business and FinTech student",
        "description": "Builds operational software, loyalty systems, and analytics tools, informed by hands-on retail, logistics, and service operations experience.",
        "address": { "@type": "PostalAddress", "addressLocality": "Singapore", "addressCountry": "SG" },
        "alumniOf": { "@type": "EducationalOrganization", "name": "Nanyang Polytechnic" },
        "knowsAbout": [
          "Python",
          "Tableau",
          "React",
          "Workflow design",
          "Financial technology",
          "Data analysis"
        ],
        "sameAs": ["https://linkedin.com/in/hadi-qusyairi"]
      }
    </script>

    <!-- Runs before first paint. The theme was only applied in a React effect, so the
         attribute stayed unset until the bundle parsed: a visitor who chose dark last
         time got a cream flash first, and a visitor whose OS is dark got a light site
         permanently, because prefers-color-scheme was never consulted at all. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
